name: Rust checks
on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan1 mesa-vulkan-drivers xvfb xauth
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Graphical solo shift playthrough (software Vulkan)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          for mesa_icd_path in /usr/share/vulkan/icd.d/*lvp*.json; do
            if [ -f "$mesa_icd_path" ]; then
              export VK_DRIVER_FILES="$mesa_icd_path"
              break
            fi
          done
          export WGPU_BACKEND=vulkan
          xvfb-run -a --server-args="-screen 0 1600x1000x24" cargo run --locked -- --playtest --capture-dir ci-captures
      - name: Save playthrough screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: solo-office-playthrough
          path: ci-captures/*.png
          if-no-files-found: ignore
