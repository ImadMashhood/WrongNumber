[workspace]
members = ["crates/simulation", "crates/net", "crates/caller", "crates/caller-server"]
resolver = "3"

[package]
name = "wrong-number"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = [
    "std", "async_executor", "bevy_asset", "bevy_log", "bevy_window",
    "bevy_winit", "bevy_pbr", "bevy_core_pipeline", "multi_threaded",
    "x11", "keyboard", "mouse", "png", "ui_bevy_render",
    "bevy_ui_widgets", "ui_picking", "default_font", "bevy_audio", "wav",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "=0.33.12", features = ["serde"] }

arboard = { version = "3.6", default-features = false }
uuid = { version = "1", features = ["v4"] }
wrong-number-net = { path = "crates/net" }
cpal = "=0.17.3"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "wav"] }
wrong-number-caller = { path = "crates/caller" }
wrong-number-sim = { path = "crates/simulation" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
